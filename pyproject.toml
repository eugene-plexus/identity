[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eugene-plexus-identity"
version = "0.2.0"
description = "Eugene Plexus identity component: constitution + self-model + persons. The Default Mode Network analogue."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Eugene Plexus contributors" },
]
keywords = ["eugene-plexus", "identity", "fastapi", "consciousness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "pyjwt>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "httpx>=0.27,<1",          # for FastAPI test client
    "ruff==0.15.14",
    "mypy==1.20.2",
    "types-pyyaml>=6,<7",
    "datamodel-code-generator==0.57.0",
]

[project.scripts]
eugene-plexus-identity = "eugene_plexus_identity.__main__:main"

[project.urls]
Homepage = "https://github.com/eugene-plexus"
Repository = "https://github.com/eugene-plexus/identity"
Specs = "https://github.com/eugene-plexus/specs"

[tool.hatch.build.targets.wheel]
packages = ["src/eugene_plexus_identity"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "src/eugene_plexus_identity/_generated",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "ASYNC",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# FastAPI uses Depends() as an argument default. Allow it only in the
# module that defines the dependencies.
"src/eugene_plexus_identity/dependencies.py" = ["B008"]
# FastAPI's `Query()` is the same idiom. Allow it in route modules
# where query-param signature documentation is the natural place
# for the call.
"src/eugene_plexus_identity/routes/self_model.py" = ["B008"]

# -----------------------------------------------------------------------------
# Mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
disable_error_code = ["call-arg"]
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "src/eugene_plexus_identity/_generated",
]

[[tool.mypy.overrides]]
module = "eugene_plexus_identity._generated.*"
ignore_errors = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
